<div class="payment-container">
  <app-loading-spinner *ngIf="loading"></app-loading-spinner>
  
  <app-error-message *ngIf="error && !loading" title="Payment Error" [message]="error"></app-error-message>

  <div class="payment-content" *ngIf="!loading && !error">
    <mat-card class="payment-card">
      <mat-card-header>
        <mat-card-title>Choose Payment Method</mat-card-title>
        <mat-card-subtitle>Select a method to confirm your booking</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <mat-radio-group [(ngModel)]="selectedMethodId" class="payment-methods-group">
          <mat-radio-button *ngFor="let method of paymentMethods" [value]="method.id" class="method-option">
            <div class="method-details">
              <strong>{{ method.name }}</strong>
              <p>{{ method.description }}</p>
            </div>
          </mat-radio-button>
        </mat-radio-group>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-button color="warn" [disabled]="submitting" routerLink="/my-bookings">Pay Later / Cancel</button>
        <button mat-raised-button color="primary" [disabled]="!selectedMethodId || submitting" (click)="onConfirmPayment()">
          <span *ngIf="!submitting">Confirm Payment</span>
          <span *ngIf="submitting">Processing...</span>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
