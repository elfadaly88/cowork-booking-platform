<div class="payment-container">
  <app-loading-spinner *ngIf="loading"></app-loading-spinner>

  <app-error-message *ngIf="error && !loading" title="Payment Error" [message]="error"></app-error-message>

  <div class="payment-content" *ngIf="!loading && !error">
    <mat-card class="payment-card">
      <mat-card-header>
        <mat-card-title>{{ 'PAYMENT.CHOOSE_METHOD' | translate }}</mat-card-title>
        <mat-card-subtitle>{{ 'PAYMENT.SELECT_METHOD' | translate }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <mat-radio-group [(ngModel)]="selectedMethodId" class="payment-methods-group">
          <mat-radio-button *ngFor="let method of paymentMethods" [value]="method.id" class="method-option">
            <div class="method-details">
              <strong>{{ method.name }}</strong>
              <p>{{ method.description }}</p>
            </div>
          </mat-radio-button>
        </mat-radio-group>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-button color="warn" [disabled]="submitting" routerLink="/my-bookings">{{ 'PAYMENT.PAY_LATER' | translate }} / {{ 'COMMON.CANCEL' | translate }}</button>
        <button mat-raised-button color="primary" [disabled]="!selectedMethodId || submitting" (click)="onConfirmPayment()">
          <span *ngIf="!submitting">{{ 'PAYMENT.CONFIRM_PAYMENT' | translate }}</span>
          <span *ngIf="submitting">{{ 'COMMON.PROCESSING' | translate }}</span>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
