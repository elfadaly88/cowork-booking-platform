<div class="workspace-management-container">
  <!-- Success/Error Messages -->
  <div *ngIf="success()" class="alert alert-success">{{ success() }}</div>
  <div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>

  <!-- List View -->
  <div *ngIf="viewMode() === 'list'" class="workspace-list-view">
    <div class="header">
      <h2>Workspace Management</h2>
      <button class="btn btn-primary" (click)="addNewWorkspace()">Add New Workspace</button>
    </div>

    <div *ngIf="loading()" class="loading-container">
      <div class="spinner"></div>
      <p>Loading workspaces...</p>
    </div>

    <div *ngIf="!loading() && workspaces().length === 0" class="empty-state">
      <p>No workspaces found. Click "Add New Workspace" to create one.</p>
    </div>

    <div *ngIf="!loading() && workspaces().length > 0" class="workspace-grid">
      <div *ngFor="let workspace of workspaces()" class="workspace-card" (click)="editWorkspace(workspace)">
        <h3>{{ workspace.name }}</h3>
        <p class="location">{{ workspace.city }}, {{ workspace.address }}</p>
        <p class="description">{{ workspace.description }}</p>
        <div class="rooms-info">
          <span class="room-count">{{ workspace.rooms?.length || 0 }} Rooms</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Form moved to a dedicated admin route /admin/workspaces/new or /admin/workspaces/edit/:id -->
</div>
